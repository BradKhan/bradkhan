name: Profile and composition catalog checks

on:
  push:
    paths:
      - 'composable-internet/**'
      - 'README.md'
      - 'BRAND.md'
      - 'AGENTS.md'
      - 'llms.txt'
      - 'data/profile.json'
      - 'assets/**'
      - '.github/workflows/profile-catalog.yml'
  pull_request:
    paths:
      - 'composable-internet/**'
      - 'README.md'
      - 'BRAND.md'
      - 'AGENTS.md'
      - 'llms.txt'
      - 'data/profile.json'
      - 'assets/**'
      - '.github/workflows/profile-catalog.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog offline
        run: python composable-internet/scripts/validate.py
      - name: Validate experimental skill packs
        run: python composable-internet/stack-mutiny/scripts/validate.py
      - name: Validate installable profile catalog
        run: python composable-internet/stack-mutiny/install.py validate --manifest composable-internet/stack-mutiny/catalog.json
      - name: Test profile plans are read-only
        run: python composable-internet/stack-mutiny/install.py plan ai-memory,ai-compute --agent codex --manifest composable-internet/stack-mutiny/catalog.json
      - name: Smoke-test indexed skill search on four professional tasks
        run: |
          python composable-internet/stack-mutiny/search.py "React performance" --role developer --top 3 --json > /tmp/developer.json
          python composable-internet/stack-mutiny/search.py "portfolio risk" --role family-office --top 3 --json > /tmp/family-office.json
          python composable-internet/stack-mutiny/search.py "SEO copywriting" --role marketing --top 3 --json > /tmp/marketing.json
          python composable-internet/stack-mutiny/search.py "memory retrieval" --role ai-memory --top 3 --json > /tmp/ai-memory.json
          python -c "import json; from pathlib import Path; names=['developer','family-office','marketing','ai-memory']; data=[json.loads(Path('/tmp/'+x+'.json').read_text()) for x in names]; assert all(0 < o['count'] <= 3 for o in data), data; [print(n, [i['name'] for i in o['results']]) for n,o in zip(names,data)]"
      - name: Test role installer and legacy pack compiler
        run: python -m unittest discover -s composable-internet/stack-mutiny/tests -p 'test_*.py'
