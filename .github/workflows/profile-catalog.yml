name: Profile and composition catalog checks

on:
  push:
    paths:
      - 'composable-internet/**'
      - 'README.md'
      - 'BRAND.md'
      - 'AGENTS.md'
      - 'llms.txt'
      - 'data/profile.json'
      - 'assets/profile-hero.svg'
      - '.github/workflows/profile-catalog.yml'
  pull_request:
    paths:
      - 'composable-internet/**'
      - 'README.md'
      - 'BRAND.md'
      - 'AGENTS.md'
      - 'llms.txt'
      - 'data/profile.json'
      - 'assets/profile-hero.svg'
      - '.github/workflows/profile-catalog.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog offline
        run: python composable-internet/scripts/validate.py
      - name: Validate experimental skill packs
        run: python composable-internet/stack-mutiny/scripts/validate.py
      - name: Test offline pack compiler
        run: python -m unittest discover -s composable-internet/stack-mutiny/tests -p 'test_*.py'
