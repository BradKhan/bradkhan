name: Stack Mutiny source integrity

on:
  schedule:
    - cron: '35 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current upstream skill files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python composable-internet/stack-mutiny/audit.py --online --output stack-mutiny-source-audit.json
      - name: Discover additional skill candidates
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python composable-internet/stack-mutiny/discover.py --online --limit 2000 --output stack-mutiny-discovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-mutiny-source-audit
          path: |
            stack-mutiny-source-audit.json
            stack-mutiny-discovery.json
          if-no-files-found: warn
