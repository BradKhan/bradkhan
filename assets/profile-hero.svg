<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Brad Khan: technology should increase human agency</title>
  <desc id="desc">Editorial black and warm gold cover with Brad Khan's name, identity, and declaration about human agency.</desc>
  <rect width="1200" height="390" fill="#15191d"/>
  <path d="M0 0H9V390H0Z" fill="#bda16a"/>
  <g stroke="#bda16a" stroke-opacity=".13" stroke-width="1">
    <path d="M48 46H1154M48 337H1154"/>
    <path d="M48 46V337M1154 46V337"/>
    <path d="M744 46V337"/>
  </g>
  <text x="55" y="69" fill="#c8af7f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">BRADKHAN / OPEN SOURCE &amp; HUMAN AGENCY</text>
  <text x="1096" y="69" text-anchor="end" fill="#b8b4ac" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">01 / MANIFESTO</text>
  <text x="55" y="184" fill="#f0eee8" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="83" font-weight="900" letter-spacing="-4">BRAD</text>
  <text x="55" y="264" fill="#f0eee8" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="83" font-weight="900" letter-spacing="-4">KHAN.</text>
  <path d="M55 291H289" stroke="#bda16a" stroke-width="3"/>
  <text x="55" y="319" fill="#b8b4ac" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.4">PHILOSOPHER  /  SYSTEMS ENTREPRENEUR</text>
  <text x="773" y="135" fill="#c8af7f" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">A POSITION, NOT A PRODUCT</text>
  <text x="773" y="183" fill="#f0eee8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">TECHNOLOGY</text>
  <text x="773" y="222" fill="#f0eee8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">SHOULD INCREASE</text>
  <text x="773" y="261" fill="#c8af7f" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">HUMAN AGENCY.</text>
  <text x="773" y="303" fill="#b8b4ac" font-family="Arial, Helvetica, sans-serif" font-size="14">The human is not a resource.</text>
  <text x="55" y="367" fill="#888e94" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.3">INTELLIGENCE   /   ORGANIZATION   /   TECHNOLOGY   /   POWER</text>
  <text x="1150" y="367" text-anchor="end" fill="#888e94" font-family="Arial, Helvetica, sans-serif" font-size="12">BRADKHAN.COM</text>
</svg>
